spring.application.name=EnlazadosTW

# ====================
# Base de datos
# ====================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

# ====================
# JWT Configuration
# ====================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${APP_JWT_REFRESH_EXPIRATION:604800000}

# ====================
# Email / Gmail SMTP
# ====================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}

app.email.from=${APP_EMAIL_FROM}
app.email.verification-expiration-minutes=${APP_EMAIL_VERIFICATION_EXPIRATION_MINUTES:1440}
app.email.password-reset-expiration-minutes=${APP_EMAIL_PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.frontend.verify-email-url=${APP_FRONTEND_VERIFY_EMAIL_URL:http://localhost:8100/verify-email}
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL:http://localhost:8100/reset-password}
app.frontend.therapeutic-team-invitation-url=${APP_FRONTEND_THERAPEUTIC_TEAM_INVITATION_URL:http://localhost:8100/therapeutic-team-invitation}

# ====================
# Firebase / FCM
# ====================
app.firebase.enabled=${APP_FIREBASE_ENABLED:false}
app.firebase.project-id=${APP_FIREBASE_PROJECT_ID:}
app.firebase.credentials-path=${APP_FIREBASE_CREDENTIALS_PATH:}

# ====================
# Gemini / Spring AI
# ====================
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash}
spring.ai.google.genai.chat.temperature=${SPRING_AI_GOOGLE_GENAI_CHAT_TEMPERATURE:0.2}

app.weekly-summary.enabled=${APP_WEEKLY_SUMMARY_ENABLED:true}
app.weekly-summary.cron=${APP_WEEKLY_SUMMARY_CRON:0 0 18 ? * FRI}
app.weekly-summary.zone=${APP_WEEKLY_SUMMARY_ZONE:America/Argentina/Buenos_Aires}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8100,http://localhost,http://127.0.0.1:8100,capacitor://localhost,https://*.pages.dev}

# ====================
# Server Configuration
# ====================
server.port=${PORT:8080}

# ====================
# Swagger / OpenAPI Configuration
# ====================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operations-sorter=${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:method}
springdoc.swagger-ui.filter=${SPRINGDOC_SWAGGER_UI_FILTER:true}
