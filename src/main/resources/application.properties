spring.application.name=EnlazadosTW

# ====================
# Base de datos
# ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/enlazadosbd
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ====================
# JWT Configuration
# ====================
# Clave secreta para firmar JWT (cambiar en producción - mínimo 32 caracteres)
app.jwt.secret=mySecretKeyForJWTTokenGenerationPleaseChangeInProduction1234567890
# Tiempo de expiración del token en milisegundos (ej: 86400000 = 24 horas)
app.jwt.expiration=86400000
# Tiempo de expiración del refresh token en milisegundos (ej: 604800000 = 7 días)
app.jwt.refresh-expiration=604800000

# ====================
# Server Configuration
# ====================
server.port=8080
# server.servlet.context-path=/api  # Comentado porque causa conflictos con Swagger
# Los endpoints van en /api gracias a @RequestMapping en los controladores

# ====================
# Swagger / OpenAPI Configuration
# ====================
# Documentación disponible en: http://localhost:8080/swagger-ui.html
# JSON OpenAPI en: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
# Ordena los endpoints por nombre de método en lugar de por operación
springdoc.swagger-ui.operations-sorter=method
# Muestra solo los modelos que se usan en las operaciones
springdoc.swagger-ui.filter=true
